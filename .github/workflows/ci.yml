name: CI
on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.md'
jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    strategy:
      fail-fast: false
      matrix:
        include:
          # Recommended version
          - go-version: '1.25.x'
            couchdb-version: '3.3.3'
            lint: true
          # More exotic version
          - go-version: '1.26.x'
            couchdb-version: '3.3.3'
    steps:
      - name: Install CouchDB
        run: |
          curl -s https://couchdb.apache.org/repo/keys.asc | gpg --dearmor | sudo cat > /usr/share/keyrings/couchdb-archive-keyring.gpg
          source /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/couchdb-archive-keyring.gpg] https://apache.jfrog.io/artifactory/couchdb-deb/ ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/couchdb.list
          sudo apt-get update
          sudo debconf-set-selections <<-EOF
                couchdb couchdb/mode select standalone
                couchdb couchdb/mode seen true
                couchdb couchdb/bindaddress string 127.0.0.1
                couchdb couchdb/bindaddress seen true
                couchdb couchdb/adminpass password password
                couchdb couchdb/adminpass seen true
                couchdb couchdb/adminpass_again password password
                couchdb couchdb/adminpass_again seen true
                couchdb couchdb/cookie string elmo
                couchdb couchdb/cookie seen true
          EOF
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --allow-remove-essential --allow-change-held-packages couchdb=${{ matrix.couchdb-version }}*
          echo "COZY_REGISTRY_COUCHDB_USER=admin" >> $GITHUB_ENV
          echo "COZY_REGISTRY_COUCHDB_PASSWORD=password" >> $GITHUB_ENV
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install
        run: |
          git config --global user.email "github@spam.cozycloud.cc"
          git config --global user.name "github actions"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make install
      - name: Lint
        if: ${{ matrix.lint }}
        run: make lint
      # The S3 storage tests skip themselves when no server answers, so this is
      # what makes them actually run. MinIO needs a command, which the services
      # block cannot provide, hence a plain docker run.
      #
      # The image is the Docker Hub mirror cozy-stack settled on: the upstream
      # Quay one no longer allows anonymous pulls, and minio/minio has no tags
      # left on Docker Hub.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio >&2
          exit 1
      - name: Unit tests
        # Makes the S3 storage tests fail rather than skip if MinIO is not
        # answering, so that a green build means they really ran.
        env:
          MINIO_REQUIRED: '1'
        run: make tests
